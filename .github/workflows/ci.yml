name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_TOOLCHAIN: .github/ci/toolchain.txt

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync locked project environment
        run: uv sync --frozen
      - name: Ruff lint
        run: uv run --frozen --with-requirements "$CI_TOOLCHAIN" ruff check .

  pyrefly:
    name: Pyrefly
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync locked project environment
        run: uv sync --frozen
      - name: Pyrefly type check
        run: uv run --frozen --with-requirements "$CI_TOOLCHAIN" pyrefly check

  pytest:
    name: Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync locked project environment
        run: uv sync --frozen
      - name: Pytest suite
        run: uv run --frozen --with-requirements "$CI_TOOLCHAIN" pytest -q
