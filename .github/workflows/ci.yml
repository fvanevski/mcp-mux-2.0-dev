name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7.1.2
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sync project
        run: uv sync --frozen --all-groups
      - name: Install pinned validation tools
        run: uv pip install --python .venv/bin/python -r .github/ci/toolchain.txt
      - name: Ruff
        run: .venv/bin/ruff check .
      - name: Pyrefly
        run: .venv/bin/pyrefly check mcp_router tests

  unit:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7.1.2
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sync project
        run: uv sync --frozen --all-groups
      - name: Run unit/regression suites
        run: >-
          uv run pytest -q tests
          --ignore=tests/test_compatibility_baseline.py
          --ignore=tests/test_phase5_legacy_sse.py

  integration:
    name: Integration tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7.1.2
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sync project
        run: uv sync --frozen --all-groups
      - name: Run compatibility and lifecycle integration suites
        run: >-
          uv run pytest -q
          tests/test_compatibility_baseline.py
          tests/test_phase5_legacy_sse.py
          tests/test_observability.py

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7.1.2
        with:
          python-version: "3.13"
      - name: Generate secure cryptography lock block
        run: |
          uv lock --upgrade-package cryptography
          python - <<'PY'
          from pathlib import Path

          text = Path("uv.lock").read_text()
          start = text.index('[[package]]\nname = "cryptography"')
          end = text.index("\n[[package]]", start + 1)
          Path("/tmp/cryptography.block").write_text(text[start:end])
          PY
      - name: Upload resolver-generated cryptography block
        uses: actions/upload-artifact@v4
        with:
          name: phase6-secure-cryptography-block
          path: /tmp/cryptography.block
          if-no-files-found: error

  conformance:
    name: MCP conformance (2026-07-28)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout official Python MCP SDK 2.1.1 fixture
        uses: actions/checkout@v4
        with:
          repository: modelcontextprotocol/python-sdk
          ref: 0921d94a74db900dccd2d534842aa7b6160542d2
          path: .conformance/python-sdk
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@v7.1.2
        with:
          python-version: "3.13"
      - name: Sync project
        run: uv sync --frozen --all-groups
      - name: Sync official Python SDK Everything server
        working-directory: .conformance/python-sdk
        run: uv sync --frozen --all-extras --package mcp-everything-server
      - name: Start official Python SDK Everything server
        working-directory: .conformance/python-sdk
        env:
          PORT: "3001"
        run: |
          uv run --frozen mcp-everything-server --port "$PORT" > /tmp/everything.log 2>&1 &
          echo $! > /tmp/everything.pid
          timeout 30 bash -c 'until curl -sS -o /dev/null http://127.0.0.1:3001/mcp; do sleep 0.5; done'
      - name: Start mux proxy
        env:
          MCP_MUX_CONFIG: ${{ github.workspace }}/tests/conformance/router.yaml
        run: |
          uv run python main.py --host 127.0.0.1 --port 8012 > /tmp/mcp-mux.log 2>&1 &
          echo $! > /tmp/mcp-mux.pid
          timeout 30 bash -c 'until curl -fsS http://127.0.0.1:8012/summary >/dev/null; do sleep 0.5; done'
      - name: Run official MCP conformance suite through mux
        run: >-
          npx --yes @modelcontextprotocol/conformance@0.2.0-alpha.11
          server
          --url http://127.0.0.1:8012/conformance
          --requirements 2026-07-28
          --verbose
      - name: Emit service logs on failure
        if: failure()
        run: |
          echo '--- Everything server ---'
          cat /tmp/everything.log || true
          echo '--- mcp-mux ---'
          cat /tmp/mcp-mux.log || true
      - name: Stop services
        if: always()
        run: |
          test ! -f /tmp/mcp-mux.pid || kill "$(cat /tmp/mcp-mux.pid)" || true
          test ! -f /tmp/everything.pid || kill "$(cat /tmp/everything.pid)" || true
