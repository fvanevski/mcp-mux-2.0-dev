# @format

security:
  mode: "local_only"
  allowed_hosts:
    - "127.0.0.1"
    - "localhost"
    - "::1"
  allowed_origins: []

endpoints:
  - path: "web-search"
    mode: "remote"
    url: "https://mcp.garion.us/mcp"
    summary: "Google Search and content extraction tool"

  - path: "firecrawl"
    mode: "managed_cli"
    unsafe_shell_command: "export NVM_DIR=$HOME/.config/nvm && [ -s $NVM_DIR/nvm.sh ] && . $NVM_DIR/nvm.sh && npx --yes firecrawl-mcp"
    env:
      HTTP_STREAMABLE_SERVER: "true"
      PORT: "3033"
      HOST: "localhost"
      FIRECRAWL_API_URL: "http://garion.us:3002"
    readiness:
      host: "localhost"
      port: 3033
      timeout: 15
      interval: 0.2
    url: "http://localhost:3033/mcp"
    summary: "Firecrawl Web Content Extraction Tool"
    timeout: 300
    allowed_tools:
      - "firecrawl_search"
      - "firecrawl_scrape"

  # - path: "crawl4ai"
  #   mode: "remote"
  #   url: "https://crawl4ai.garion.us/mcp/sse"
  #   transport: "sse"
  #   headers:
  #     Authorization: "Bearer ${CRAWL4AI_API_TOKEN}"
  #   summary: "Crawl4AI self-hosted web crawling and extraction tools"
  #   timeout: 300

  - path: "huggingface"
    mode: "remote"
    url: "https://huggingface.co/mcp"
    headers:
      Authorization: "Bearer ${HF_TOKEN:-}"
    summary: "HuggingFace MCP Server — model search, hub browsing, model download"
    timeout: 300

  - path: "context7"
    mode: "remote"
    url: "https://mcp.context7.com/mcp"
    headers:
      Authorization: "Bearer ${CONTEXT7_TOKEN:-}"
    summary: "Context7 documentation lookup and indexing system"
    timeout: 300
